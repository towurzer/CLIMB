            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DresLoginRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Connection successful",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "status": {
                      "type": "string"
                    },
                    "evaluation_id": {
                      "type": "string"
                    },
                    "selected_name": {
                      "type": "string",
                      "nullable": true
                    },
                    "defaulted": {
                      "type": "boolean"
                    },
                    "message": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
