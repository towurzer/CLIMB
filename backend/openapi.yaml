{
  "openapi": "3.0.3",
  "info": {
    "title": "Video Retrieval API",
    "description": "API specification for the CLIMB backend, a Video Browser allowing for searching, browsing, and DRES integration (known-item, VQA text answer, and collaborative Ad-hoc Video Search submissions).\n\nv2.0.0: results are scenes, not keyframes. `shot_id` is replaced by `scene_id` (the master shot) plus `keyframe_id` (the frame shown). Thumbnails are served from /thumbs and /kf, videos from /videos, all derived from (video_id, shot_index, kf_index). Find-similar moved to /climb/search/similar/{keyframe_id}.\n\nv2.1.0: AVS session bookkeeping moved out of this backend into a separate service (`climb-avs-service`), so teammates running their own local stacks share one exclusion list. Every AVS route can now answer **503** when that service is unreachable, which is deliberately distinct from 404: 404 means the session is gone, 503 means we cannot tell. Snapshots carry a `collab` field, and /climb/health reports `avs_collab`. Search and DRES submission never depend on the service; search filters a local mirror. With `AVS_SESSION_SERVICE_URL` unset the store stays in-process and 503 never occurs.",
    "version": "2.1.0"
  },
  "servers": [
    {
      "url": "http://localhost:8000",
      "description": "Local development server"
    },
    {
      "url": "http://redacted",
      "description": "Online Server"
    }
  ],
  "paths": {
    "/climb/health": {
      "get": {
        "summary": "Liveness probe for the backend and the embedding service",
        "description": "Answers as long as the backend process is running. Reaching it requires no database or cache, so a response always means the API itself is up. It additionally probes the Python embedding worker at SEARCH_ENGINE_URL/api/health with a 2 second timeout, and the AVS session service when one is configured, reporting both outcomes but never failing because of them: the status code stays 200 whenever the backend lives, and callers read the body to tell a healthy system from a degraded one.\n\nThe frontend polls this every 5 seconds to drive the coloured indicator in the header. Three failure tiers, because they cost very different things: red when this endpoint cannot be reached at all (nothing works), orange for 'degraded' (no embedding service, so search is dead), and green with a yellow blink for 'collab_offline' (only AVS collaboration is down - search, browsing and DRES submission are all unaffected, so painting it orange would misreport a working tool as broken).",
        "operationId": "healthCheck",
        "responses": {
          "200": {
            "description": "Backend is alive. 'status' is 'ok' when the embedding service is ready and collaboration is fine, 'collab_offline' when only the AVS session service is unreachable, and 'degraded' when the embedding service is not usable.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "status": {
                      "type": "string",
                      "description": "'ok' when every component answered. 'degraded' when the backend is up but the embedding service is not usable, which kills search. 'collab_offline' when everything works except the shared AVS session service, which only stops teammates syncing.",
                      "enum": [
                        "ok",
                        "collab_offline",
                        "degraded"
                      ]
                    },
                    "backend": {
                      "type": "string",
                      "description": "Always 'ok' - if the backend were not, this response would not exist",
                      "enum": [
                        "ok"
                      ]
                    },
                    "embedding_service": {
                      "type": "object",
                      "description": "Outcome of the probe against the Python embedding worker",
                      "properties": {
                        "reachable": {
                          "type": "boolean",
                          "description": "Whether the worker answered the probe at all"
                        },
                        "ready": {
                          "type": "boolean",
                          "description": "Whether the worker answered and has an initialized search engine. Text search only works when this is true."
                        },
                        "detail": {
                          "type": "string",
                          "description": "Human readable reason, surfaced as the tooltip of the header indicator"
                        }
                      }
                    },
                    "avs_collab": {
                      "type": "object",
                      "description": "State of the shared AVS session service. Actively probed rather than inferred from the last call, because with nobody in AVS mode there are no calls to infer from.",
                      "properties": {
                        "configured": {
                          "type": "boolean",
                          "description": "Whether AVS_SESSION_SERVICE_URL is set. False means sessions are in-process and there is nothing to be offline."
                        },
                        "reachable": {
                          "type": "boolean",
                          "description": "Whether the session service answered. Always true when 'configured' is false."
                        },
                        "detail": {
                          "type": "string",
                          "description": "Human readable reason, surfaced as the tooltip of the header indicator"
                        }
                      }
                    },
                    "uptime_seconds": {
                      "type": "integer",
                      "description": "Whole seconds since the backend process started"
                    },
                    "time": {
                      "type": "string",
                      "format": "date-time",
                      "description": "Server clock at the time of the response, ISO 8601"
                    }
                  }
                },
                "examples": {
                  "healthy": {
                    "summary": "Backend and embedding service both up",
                    "value": {
                      "status": "ok",
                      "backend": "ok",
                      "embedding_service": {
                        "reachable": true,
                        "ready": true,
                        "detail": "Embedding service ready"
                      },
                      "uptime_seconds": 4213,
                      "time": "2026-07-26T12:34:56.789Z",
                      "avs_collab": {
                        "configured": true,
                        "reachable": true,
                        "detail": "AVS session service reachable"
                      }
                    }
                  },
                  "collab_offline": {
                    "summary": "Everything works except AVS collaboration",
                    "value": {
                      "status": "collab_offline",
                      "backend": "ok",
                      "embedding_service": {
                        "reachable": true,
                        "ready": true,
                        "detail": "Embedding service ready"
                      },
                      "avs_collab": {
                        "configured": true,
                        "reachable": false,
                        "detail": "AVS session service unreachable: ECONNREFUSED. Collaboration is off; search and submit are unaffected."
                      },
                      "uptime_seconds": 4213,
                      "time": "2026-07-26T12:34:56.789Z"
                    }
                  },
                  "degraded": {
                    "summary": "Backend up, embedding worker not running",
                    "value": {
                      "status": "degraded",
                      "backend": "ok",
                      "embedding_service": {
                        "reachable": false,
                        "ready": false,
                        "detail": "Embedding service unreachable: connect ECONNREFUSED 127.0.0.1:5000"
                      },
                      "uptime_seconds": 12,
                      "time": "2026-07-26T12:34:56.789Z",
                      "avs_collab": {
                        "configured": false,
                        "reachable": true,
                        "detail": "AVS sessions are in-process (no shared service configured)"
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/climb/search": {
      "get": {
        "summary": "Search for video segments matching the text query",
        "operationId": "searchVideos",
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "required": true,
            "description": "Text query for search. To exclude specific videos from results, append ' --exclude: videoId1, videoId2, ...' to the query. Example: 'person running --exclude: V3C1_001, V3C1_002'",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "page",
            "in": "query",
            "required": false,
            "description": "Page number for pagination (default: 1)",
            "schema": {
              "type": "integer",
              "default": 1,
              "minimum": 1
            }
          },
          {
            "name": "per_page",
            "in": "query",
            "required": false,
            "description": "Number of results per page (default: 24, max: 100)",
            "schema": {
              "type": "integer",
              "default": 24,
              "minimum": 1,
              "maximum": 100
            }
          },
          {
            "name": "avs_session",
            "in": "query",
            "required": false,
            "description": "Active AVS session code. When provided, scenes already submitted in that collaborative session are removed from the results.\n\nFiltering reads this backend's local mirror of the session and never calls the session service, so it adds no latency and cannot fail: an unknown code, or a mirror not yet populated, simply means no filtering. Unlike earlier versions this does NOT refresh the session's idle timer - GET /climb/avs/session/{code} is the heartbeat, so a search cannot keep someone else's session alive.",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "sources",
            "in": "query",
            "required": false,
            "description": "Comma-separated list of the sources to search: any of visual, caption, ocr, asr. Omitted (or empty) means all of them.\n\nA source left out is not queried at all rather than being zero-weighted, so narrowing the list makes a search cheaper as well as quieter - useful because the OCR retriever fires on ordinary lowercase words and is weighted 4x, which lets subtitle text dominate a page for a query like 'a snowboarder doing a backflip'.\n\nThis does NOT gate the explicit phrase operators: text:\"...\" and said:\"...\" always run, because an operator in the query is an instruction rather than a source preference. Part of the cache key, so the same query against different sources is a separate result set.",
            "schema": {
              "type": "string",
              "example": "visual,caption,asr"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Search results",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SearchResponse"
                }
              }
            }
          }
        }
      }
    },
