{
  "openapi": "3.0.3",
  "info": {
    "title": "Video Retrieval API",
    "description": "API specification for the CLIMB backend, a Video Browser allowing for searching, browsing, and DRES integration (known-item and VQA text answer submissions).",
    "version": "1.0.0"
  },
  "servers": [
    {
      "url": "http://localhost:8000",
      "description": "Local development server"
    },
    {
      "url": "http://redacted",
      "description": "Online Server"
    }
  ],
  "paths": {
    "/climb/search": {
      "get": {
        "summary": "Search for video segments matching the text query",
        "operationId": "searchVideos",
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "required": true,
            "description": "Text query for search. To exclude specific videos from results, append ' --exclude: videoId1, videoId2, ...' to the query. Example: 'person running --exclude: V3C1_001, V3C1_002'",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "page",
            "in": "query",
            "required": false,
            "description": "Page number for pagination (default: 1)",
            "schema": {
              "type": "integer",
              "default": 1,
              "minimum": 1
            }
          },
          {
            "name": "per_page",
            "in": "query",
            "required": false,
            "description": "Number of results per page (default: 24, max: 100)",
            "schema": {
              "type": "integer",
              "default": 24,
              "minimum": 1,
              "maximum": 100
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Search results",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SearchResponse"
                }
              }
            }
          }
        }
      }
    },
    "/climb/videos": {
      "get": {
        "summary": "List all videos in the dataset",
        "operationId": "listVideos",
        "responses": {
          "200": {
            "description": "List of videos",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "count": {
                      "type": "integer"
                    },
                    "videos": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/VideoSummary"
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/climb/videos/{video_id}": {
      "get": {
        "summary": "Get metadata for a specific video",
        "operationId": "getVideoInfo",
        "parameters": [
          {
            "name": "video_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Detailed video metadata",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/VideoDetails"
                }
              }
            }
          }
        }
      }
    },
    "/climb/videos/{video_id}/shots": {
      "get": {
        "summary": "Get shots for a specific video",
        "description": "Returns shots ordered by start_frame/middle_frame. If both `page` and `per_page` are omitted, every shot for the video is returned in one response; if either is provided, the results are paginated.",
        "operationId": "getVideoShots",
        "parameters": [
          {
            "name": "video_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "page",
            "in": "query",
            "required": false,
            "description": "Page number (1-indexed). Enables pagination.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "default": 1
            }
          },
          {
            "name": "per_page",
            "in": "query",
            "required": false,
            "description": "Number of shots per page (capped at 200). Enables pagination.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 200,
              "default": 60
            }
          }
        ],
        "responses": {
          "200": {
            "description": "List of shots",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "video_id": {
                      "type": "string"
                    },
                    "shots": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/ShotInfo"
                      }
                    },
                    "total": {
                      "type": "integer",
                      "description": "Total number of shots for this video, regardless of pagination."
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/climb/videos/{video_id}/{shot_id}/similar": {
      "get": {
        "summary": "Find shots visually similar to the given shot",
        "operationId": "findSimilar",
        "parameters": [
          {
            "name": "video_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "shot_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "integer"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Similar search results",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "source_video": {
                      "type": "string"
                    },
                    "source_shot": {
                      "type": "integer"
                    },
                    "results": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/SearchResult"
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/climb/dres/connect": {
      "post": {
        "summary": "Authenticate with DRES and fetch the active evaluation ID",
        "operationId": "connectDres",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DresLoginRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Connection successful",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "status": {
                      "type": "string"
                    },
                    "evaluation_id": {
                      "type": "string"
                    },
                    "selected_name": {
                      "type": "string",
                      "nullable": true
                    },
                    "defaulted": {
                      "type": "boolean"
                    },
                    "message": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/climb/dres/status": {
      "get": {
        "summary": "Check current DRES connection status and active task",
        "operationId": "dresStatus",
        "responses": {
          "200": {
            "description": "Status payload",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "connected": {
                      "type": "boolean"
                    },
                    "evaluation_id": {
                      "type": "string",
                      "nullable": true
                    },
                    "active_task": {
                      "type": "string",
                      "nullable": true
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/climb/dres/submit/kis": {
      "post": {
        "summary": "Submit a video segment to the DRES server (KiS)",
        "operationId": "submitToDres",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DresSubmission"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Submission result, including the verdict reported by DRES",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DresSubmissionResult"
                }
              }
            }
          },
          "400": {
            "description": "DRES rejected the submission",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DresSubmissionError"
                }
              }
            }
          },
          "401": {
            "description": "Not connected to DRES",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DresSubmissionError"
                }
              }
            }
          }
        }
      }
    },
    "/climb/dres/submit/vqa": {
      "post": {
        "summary": "Submit a VQA text answer together with the selected media segment to the DRES server",
        "operationId": "submitVqaToDres",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/VqaSubmission"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Submission result, including the verdict reported by DRES",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DresSubmissionResult"
                }
              }
            }
          },
          "400": {
            "description": "Missing answer text, or DRES rejected the submission",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DresSubmissionError"
                }
              }
            }
          },
          "401": {
            "description": "Not connected to DRES",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DresSubmissionError"
                }
              }
            }
          }
        }
      }
    },
    "/climb/dres/submit/vqa/text": {
      "post": {
        "summary": "Submit a VQA text answer to the DRES server without any media item",
        "operationId": "submitVqaTextOnlyToDres",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/VqaTextSubmission"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Submission result, including the verdict reported by DRES",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DresSubmissionResult"
                }
              }
            }
          },
          "400": {
            "description": "Missing answer text, or DRES rejected the submission",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DresSubmissionError"
                }
              }
            }
          },
          "401": {
            "description": "Not connected to DRES",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DresSubmissionError"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "SearchResult": {
        "type": "object",
        "properties": {
          "video_id": {
            "type": "string"
          },
          "shot_id": {
            "type": "integer"
          },
          "score": {
            "type": "number",
            "format": "float"
          },
          "start_frame": {
            "type": "integer"
          },
          "end_frame": {
            "type": "integer"
          },
          "fps": {
            "type": "number",
            "format": "float"
          },
          "start_time_ms": {
            "type": "integer"
          },
          "end_time_ms": {
            "type": "integer"
          },
          "thumbnail_url": {
            "type": "string"
          }
        },
        "required": [
          "video_id",
          "shot_id",
          "score",
          "start_frame",
          "end_frame",
          "fps",
          "start_time_ms",
          "end_time_ms",
          "thumbnail_url"
        ]
      },
      "SearchResponse": {
        "type": "object",
        "properties": {
          "query": {
            "type": "string"
          },
          "page": {
            "type": "integer",
            "description": "Current page number"
          },
          "per_page": {
            "type": "integer",
            "description": "Number of results per page"
          },
          "count": {
            "type": "integer",
            "description": "Number of results in current page"
          },
          "has_more": {
            "type": "boolean",
            "description": "Whether more results are available beyond the current page"
          },
          "results": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/SearchResult"
            }
          }
        },
        "required": [
          "query",
          "page",
          "per_page",
          "count",
          "has_more",
          "results"
        ]
      },
      "VideoSummary": {
        "type": "object",
        "properties": {
          "video_id": {
            "type": "string"
          },
          "fps": {
            "type": "number",
            "format": "float"
          },
          "duration_sec": {
            "type": "number",
            "format": "float"
          },
          "num_shots": {
            "type": "integer"
          },
          "thumbnail_url": {
            "type": "string"
          }
        },
        "required": [
          "video_id",
          "fps",
          "duration_sec",
          "num_shots",
          "thumbnail_url"
        ]
      },
      "VideoDetails": {
        "type": "object",
        "properties": {
          "video_id": {
            "type": "string"
          },
          "fps": {
            "type": "number",
            "format": "float"
          },
          "duration_sec": {
            "type": "number",
            "format": "float"
          },
          "width": {
            "type": "integer"
          },
          "height": {
            "type": "integer"
          },
          "video_url": {
            "type": "string"
          }
        },
        "required": [
          "video_id",
          "fps",
          "duration_sec",
          "width",
          "height",
          "video_url"
        ]
      },
      "ShotInfo": {
        "type": "object",
        "properties": {
          "shot_id": {
            "type": "integer"
          },
          "start_frame": {
            "type": "integer"
          },
          "end_frame": {
            "type": "integer"
          },
          "fps": {
            "type": "number",
            "format": "float"
          },
          "thumbnail_url": {
            "type": "string"
          }
        },
        "required": [
          "shot_id",
          "start_frame",
          "end_frame",
          "fps",
          "thumbnail_url"
        ]
      },
      "DresSubmission": {
        "type": "object",
        "properties": {
          "video_id": {
            "type": "string"
          },
          "start_time_ms": {
            "type": "integer"
          },
          "end_time_ms": {
            "type": "integer"
          }
        },
        "required": [
          "video_id",
          "start_time_ms",
          "end_time_ms"
        ]
      },
      "VqaSubmission": {
        "type": "object",
        "properties": {
          "text_answer": {
            "type": "string"
          },
          "video_id": {
            "type": "string",
            "nullable": true
          },
          "start_time_ms": {
            "type": "integer",
            "nullable": true
          },
          "end_time_ms": {
            "type": "integer",
            "nullable": true
          }
        },
        "required": [
          "text_answer"
        ]
      },
      "VqaTextSubmission": {
        "type": "object",
        "properties": {
          "text_answer": {
            "type": "string"
          }
        },
        "required": [
          "text_answer"
        ]
      },
      "DresSubmissionResult": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "success",
              "pending"
            ],
            "description": "'pending' when DRES accepted the submission but has not graded it yet (HTTP 202)"
          },
          "dres_status": {
            "type": "integer",
            "description": "HTTP status code returned by the DRES submission endpoint"
          },
          "status_summary": {
            "type": "string",
            "description": "Human readable summary of dres_status, e.g. 'Accepted & graded'"
          },
          "verdict": {
            "type": "string",
            "nullable": true,
            "enum": [
              "CORRECT",
              "WRONG",
              "INDETERMINATE",
              "UNDECIDABLE",
              null
            ],
            "description": "The verdict reported by DRES, null while no verdict is available"
          },
          "message": {
            "type": "string"
          },
          "dres_response": {
            "type": "object",
            "description": "The raw SuccessfulSubmissionsStatus payload returned by DRES"
          }
        },
        "required": [
          "status",
          "dres_status",
          "status_summary",
          "message"
        ]
      },
      "DresSubmissionError": {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          },
          "dres_status": {
            "type": "integer",
            "nullable": true,
            "description": "HTTP status code returned by DRES, null when DRES could not be reached"
          },
          "status_summary": {
            "type": "string"
          },
          "details": {
            "type": "string"
          }
        },
        "required": [
          "error"
        ]
      },
      "DresLoginRequest": {
        "type": "object",
        "properties": {
          "username": {
            "type": "string"
          },
          "password": {
            "type": "string"
          },
          "dres_url": {
            "type": "string",
            "default": "https://vbs.videobrowsing.org"
          }
          ,
          "dres_name": {
            "type": "string",
            "description": "Requested evaluation name (e.g. IVADL26)",
            "default": "IVADL26"
          }
        },
        "required": [
          "username",
          "password",
          "dres_url"
        ]
      }
    }
  }
}