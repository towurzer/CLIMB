    "/climb/avs/session": {
      "post": {
        "summary": "Create a new collaborative AVS session",
        "description": "Creates a fresh session with a random 4-letter (consonant-only) code and returns its snapshot. Sessions live in the shared session service when AVS_SESSION_SERVICE_URL is configured, so every teammate's backend sees the same one; otherwise they are in-process and local to this backend. A session is deleted after 2 hours with no interaction (a submit or a GET poll). Creating needs the service, so this is the one AVS route that cannot fall back to a mirror: 503 when it is unreachable.",
        "operationId": "createAvsSession",
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "name": {
                    "type": "string",
                    "nullable": true,
                    "description": "Optional human-readable label for the session"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Session created",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AvsSession"
                }
              }
            }
          },
          "503": {
            "description": "The shared AVS session service could not be reached, so the backend has nothing to say about this session. Deliberately NOT 404: 404 means the session is gone, 503 means we cannot tell, and a client must not discard a working exclusion list over the difference. Never returned when AVS_SESSION_SERVICE_URL is unset.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AvsUnreachable"
                }
              }
            }
          }
        }
      }
    },
    "/climb/avs/sessions": {
      "get": {
        "summary": "List active AVS sessions",
        "description": "Lightweight listing for a 'join one of these' UI. Always asks the session service, so it answers 503 rather than an empty list when that is unreachable -- 'nobody has a session open' and 'we could not ask' must not look alike.",
        "operationId": "listAvsSessions",
        "responses": {
          "200": {
            "description": "Active sessions",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "sessions": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/AvsSessionSummary"
                      }
                    }
                  }
                }
              }
            }
          },
          "503": {
            "description": "The shared AVS session service could not be reached, so the backend has nothing to say about this session. Deliberately NOT 404: 404 means the session is gone, 503 means we cannot tell, and a client must not discard a working exclusion list over the difference. Never returned when AVS_SESSION_SERVICE_URL is unset.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AvsUnreachable"
                }
              }
            }
          }
        }
      }
    },
    "/climb/avs/session/{code}/join": {
      "post": {
        "summary": "Join an existing AVS session by code",
        "description": "Returns the session snapshot (case-insensitive code) and refreshes its idle timer. Awaits the session service deliberately: joining is an explicit action that needs a real answer, and guessing that a code exists would be worse than waiting for the round trip. 404 means the session does not exist or has expired; 503 means the service could not be reached.",
        "operationId": "joinAvsSession",
        "parameters": [
          {
            "name": "code",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Joined; session snapshot",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AvsSession"
                }
              }
            }
          },
          "404": {
            "description": "Session not found or expired",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AvsSessionError"
                }
              }
            }
          },
          "503": {
            "description": "The shared AVS session service could not be reached, so the backend has nothing to say about this session. Deliberately NOT 404: 404 means the session is gone, 503 means we cannot tell, and a client must not discard a working exclusion list over the difference. Never returned when AVS_SESSION_SERVICE_URL is unset.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AvsUnreachable"
                }
              }
            }
          }
        }
      }
    },
    "/climb/avs/session/{code}": {
      "get": {
        "summary": "Fetch an AVS session snapshot (also the poll/heartbeat)",
        "description": "Returns the current scenes, covered videos and counts for the session. This is the heartbeat: clients poll it to stay in sync and to keep the session alive.\n\nThe backend serves this from its local mirror, refreshing it from the session service when older than AVS_MIRROR_TTL_MS. If the service is unreachable but a mirror exists, the last known snapshot is returned with `collab: \"offline\"` -- the team keeps working from what it already knows. 503 is only for an unreachable service with nothing cached; 404 still means genuinely expired.",
        "operationId": "getAvsSession",
        "parameters": [
          {
            "name": "code",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Session snapshot",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AvsSession"
                }
              }
            }
          },
          "404": {
            "description": "Session not found or expired",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AvsSessionError"
                }
              }
            }
          },
          "503": {
            "description": "The shared AVS session service could not be reached, so the backend has nothing to say about this session. Deliberately NOT 404: 404 means the session is gone, 503 means we cannot tell, and a client must not discard a working exclusion list over the difference. Never returned when AVS_SESSION_SERVICE_URL is unset.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AvsUnreachable"
                }
              }
            }
          }
        }
      }
    },
    "/climb/videos/{video_id}/scenes": {
      "get": {
        "summary": "Get scenes (master shots) for a specific video",
        "description": "Returns scenes in shot order, each with its keyframes. Omit both `page` and `per_page` for every scene in one response.",
        "operationId": "getVideoScenes",
        "parameters": [
          {
            "name": "video_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "page",
            "in": "query",
            "required": false,
            "description": "Page number (1-indexed). Enables pagination.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "default": 1
            }
          },
          {
            "name": "per_page",
            "in": "query",
            "required": false,
            "description": "Number of shots per page (capped at 200). Enables pagination.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 200,
              "default": 60
            }
          }
        ],
        "responses": {
          "200": {
            "description": "List of shots",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "video_id": {
                      "type": "string"
                    },
                    "total": {
                      "type": "integer",
                      "description": "Total number of shots for this video, regardless of pagination."
                    },
                    "scenes": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/SceneInfo"
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/climb/search/similar/{keyframe_id}": {
      "get": {
        "summary": "Find scenes visually similar to a keyframe",
        "operationId": "findSimilar",
        "parameters": [
          {
            "name": "keyframe_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "integer"
            },
            "description": "Keyframe to find neighbours of"
          },
          {
            "name": "exclude",
            "in": "query",
            "required": false,
            "description": "Comma-separated video ids to leave out of the results. Filtering happens inside the query, so the result limit is backfilled with the next best matches.",
            "schema": {
              "type": "string"
            },
            "example": "00113,00184"
          },
          {
            "name": "page",
            "in": "query",
            "required": false,
            "description": "1-based page number. Results are not capped - paging continues until the shots table is exhausted.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "default": 1
            }
          },
          {
            "name": "per_page",
            "in": "query",
            "required": false,
            "description": "Results per page, clamped to 1-100.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 24
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Similar search results",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "excluded": {
                      "type": "array",
                      "description": "The video ids that were excluded from this result set",
                      "items": {
                        "type": "string"
                      }
                    },
                    "page": {
                      "type": "integer"
                    },
                    "per_page": {
                      "type": "integer"
                    },
                    "count": {
                      "type": "integer",
                      "description": "Number of results on this page"
                    },
                    "has_more": {
                      "type": "boolean",
                      "description": "Whether a further page of similar shots exists"
                    },
                    "results": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/SearchResult"
                      }
                    },
                    "source_keyframe": {
                      "type": "integer"
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "SearchResult": {
        "type": "object",
        "properties": {
          "video_id": {
            "type": "string"
          },
          "score": {
            "type": "number",
            "format": "float"
          },
          "start_frame": {
            "type": "integer"
          },
          "end_frame": {
            "type": "integer"
          },
          "fps": {
            "type": "number",
            "format": "float"
          },
          "start_time_ms": {
            "type": "integer"
          },
          "end_time_ms": {
            "type": "integer"
          },
          "thumbnail_url": {
            "type": "string"
          },
          "scene_id": {
            "type": "integer",
            "description": "Master shot this result belongs to"
          },
          "keyframe_id": {
            "type": "integer",
            "description": "Keyframe shown for the scene"
          },
          "signals": {
            "type": "object",
            "description": "Retriever -> the rank it gave this scene. Keys are visual, ocr, ocr_phrase, caption, transcript, asr_phrase, or similar for find-similar. A retriever that did not find the scene is absent.",
            "additionalProperties": {
              "type": "integer"
            }
          },
          "contributions": {
            "type": "object",
            "description": "Retriever -> its share of `score`, i.e. weight / (60 + rank), summing to `score`. Ranks alone do not identify the retriever responsible for a hit, because the RRF weights differ by up to 8x.",
            "additionalProperties": {
              "type": "number",
              "format": "float"
            }
          }
        },
        "required": [
          "video_id",
          "score",
          "start_frame",
          "end_frame",
          "fps",
          "start_time_ms",
          "end_time_ms",
          "thumbnail_url",
          "scene_id"
        ]
      },
      "SearchResponse": {
        "type": "object",
        "properties": {
          "query": {
            "type": "string"
          },
          "page": {
            "type": "integer",
            "description": "Current page number"
          },
          "per_page": {
            "type": "integer",
            "description": "Number of results per page"
          },
          "count": {
            "type": "integer",
            "description": "Number of results in current page"
          },
          "has_more": {
            "type": "boolean",
            "description": "Whether more results are available beyond the current page"
          },
          "results": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/SearchResult"
            }
          }
        },
        "required": [
          "query",
          "page",
          "per_page",
          "count",
          "has_more",
          "results"
        ]
      },
      "VideoSummary": {
        "type": "object",
        "properties": {
          "video_id": {
            "type": "string"
          },
          "fps": {
            "type": "number",
            "format": "float"
          },
          "duration_sec": {
            "type": "number",
            "format": "float"
          },
          "thumbnail_url": {
            "type": "string"
          },
          "num_scenes": {
            "type": "integer"
          }
        },
        "required": [
          "video_id",
          "fps",
          "duration_sec",
          "num_shots",
          "thumbnail_url"
        ]
      },
      "VideoDetails": {
        "type": "object",
        "properties": {
          "video_id": {
            "type": "string"
          },
          "fps": {
            "type": "number",
            "format": "float"
          },
          "duration_sec": {
            "type": "number",
            "format": "float"
          },
          "width": {
            "type": "integer"
          },
          "height": {
            "type": "integer"
          },
          "video_url": {
            "type": "string"
          }
        },
        "required": [
          "video_id",
          "fps",
          "duration_sec",
          "width",
          "height",
          "video_url"
        ]
      },
      "DresSubmission": {
        "type": "object",
        "description": "Shared by KIS and AVS. The video_id + time range are what DRES scores. For AVS, additionally pass avs_session plus the scene's start_frame/end_frame so the delivered scene is recorded into the shared session and hidden from teammates.",
        "properties": {
          "video_id": {
            "type": "string"
          },
          "start_time_ms": {
            "type": "integer"
          },
          "end_time_ms": {
            "type": "integer"
          },
          "avs_session": {
            "type": "string",
            "nullable": true,
            "description": "AVS session code to record this scene into. Omit for KIS submissions."
          },
          "start_frame": {
            "type": "integer",
            "nullable": true,
            "description": "Scene start frame; identifies the scene (with end_frame) for AVS session recording. A scene spans many keyframes, so recording by frame range hides the whole scene, not just the submitted keyframe."
          },
          "end_frame": {
            "type": "integer",
            "nullable": true,
            "description": "Scene end frame; see start_frame."
          }
        },
        "required": [
          "video_id",
          "start_time_ms",
          "end_time_ms"
        ]
      },
      "VqaSubmission": {
        "type": "object",
        "properties": {
          "text_answer": {
            "type": "string"
          },
          "video_id": {
            "type": "string",
            "nullable": true
          },
          "start_time_ms": {
            "type": "integer",
            "nullable": true
          },
          "end_time_ms": {
            "type": "integer",
            "nullable": true
          }
        },
        "required": [
          "text_answer"
        ]
      },
      "VqaTextSubmission": {
        "type": "object",
        "properties": {
          "text_answer": {
            "type": "string"
          }
        },
        "required": [
          "text_answer"
        ]
      },
      "DresSubmissionResult": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "success",
              "pending"
            ],
            "description": "'pending' when DRES accepted the submission but has not graded it yet (HTTP 202)"
          },
          "dres_status": {
            "type": "integer",
            "description": "HTTP status code returned by the DRES submission endpoint"
          },
          "status_summary": {
            "type": "string",
            "description": "Human readable summary of dres_status, e.g. 'Accepted & graded'"
          },
          "verdict": {
            "type": "string",
            "nullable": true,
            "enum": [
              "CORRECT",
              "WRONG",
              "INDETERMINATE",
              "UNDECIDABLE",
              null
            ],
            "description": "The verdict reported by DRES, null while no verdict is available"
          },
          "message": {
            "type": "string"
          },
          "dres_response": {
            "type": "object",
            "description": "The raw SuccessfulSubmissionsStatus payload returned by DRES"
          }
        },
        "required": [
          "status",
          "dres_status",
          "status_summary",
          "message"
        ]
      },
      "DresSubmissionError": {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          },
          "dres_status": {
            "type": "integer",
            "nullable": true,
            "description": "HTTP status code returned by DRES, null when DRES could not be reached"
          },
          "status_summary": {
            "type": "string"
          },
          "details": {
            "type": "string"
          }
        },
        "required": [
          "error"
        ]
      },
      "DresLoginRequest": {
        "type": "object",
        "properties": {
          "username": {
            "type": "string"
          },
          "password": {
            "type": "string"
          },
          "dres_url": {
            "type": "string",
            "default": "https://vbs.videobrowsing.org"
          },
          "dres_name": {
            "type": "string",
            "description": "Requested evaluation name (e.g. IVADL26)",
            "default": "IVADL26"
          }
        },
        "required": [
          "username",
          "password",
          "dres_url"
        ]
      },
      "AvsScene": {
        "type": "object",
        "description": "A scene submitted within an AVS session, keyed by its frame range.",
        "properties": {
          "video_id": {
            "type": "string"
          },
          "start_frame": {
            "type": "integer"
          },
          "end_frame": {
            "type": "integer"
          },
          "status": {
            "type": "string",
            "enum": [
              "CORRECT",
              "WRONG",
              "INDETERMINATE",
              "UNDECIDABLE"
            ],
            "description": "DRES verdict at the time the scene was submitted (INDETERMINATE while a live judgement is pending). A CORRECT scene's video is reported in coveredVideos."
          },
          "user": {
            "type": "string",
            "nullable": true,
            "description": "CLIMB_USER of the backend that submitted this scene, or null. Only meaningful with a shared service, where several people write into one session."
          }
        },
        "required": [
          "video_id",
          "start_frame",
          "end_frame",
          "status"
        ]
      },
      "AvsSession": {
        "type": "object",
        "description": "Snapshot of a collaborative AVS session.",
        "properties": {
          "code": {
            "type": "string",
            "description": "4-letter session code"
          },
          "name": {
            "type": "string",
            "nullable": true
          },
          "scenes": {
            "type": "array",
            "description": "Scenes already submitted in this session (hide these from search / mark them in browse).",
            "items": {
              "$ref": "#/components/schemas/AvsScene"
            }
          },
          "coveredVideos": {
            "type": "array",
            "description": "Video ids with at least one CORRECT hit; dim their remaining shots.",
            "items": {
              "type": "string"
            }
          },
          "counts": {
            "type": "object",
            "properties": {
              "instances": {
                "type": "integer",
                "description": "Number of distinct scenes submitted"
              },
              "distinctVideos": {
                "type": "integer",
                "description": "Number of distinct videos those scenes span"
              }
            }
          },
          "expiresInMs": {
            "type": "integer",
            "description": "Milliseconds until this session idles out, unless an interaction refreshes it"
          },
          "collab": {
            "type": "string",
            "description": "Where this snapshot came from. 'local' = in-process store, no service configured. 'online' = the shared service answered. 'offline' = the service is unreachable and this is the last known snapshot, so teammates' newer submissions are missing.",
            "enum": [
              "local",
              "online",
              "offline"
            ]
          }
        },
        "required": [
          "code",
          "scenes",
          "coveredVideos",
          "counts",
          "expiresInMs"
        ]
      },
      "AvsSessionSummary": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string"
          },
          "name": {
            "type": "string",
            "nullable": true
          },
          "instances": {
            "type": "integer"
          },
          "expiresInMs": {
            "type": "integer"
          }
        },
        "required": [
          "code",
          "instances",
          "expiresInMs"
        ]
      },
      "AvsSessionError": {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          }
        },
        "required": [
          "error"
        ]
      },
      "SceneInfo": {
        "type": "object",
        "properties": {
          "start_frame": {
            "type": "integer"
          },
          "end_frame": {
            "type": "integer"
          },
          "fps": {
            "type": "number",
            "format": "float"
          },
          "thumbnail_url": {
            "type": "string"
          },
          "scene_id": {
            "type": "integer",
            "description": "Master shot this result belongs to"
          },
          "keyframe_id": {
            "type": "integer",
            "description": "Keyframe shown for the scene"
          }
        },
        "required": [
          "start_frame",
          "end_frame",
          "fps",
          "thumbnail_url",
          "scene_id"
        ]
      },
      "AvsUnreachable": {
        "type": "object",
        "description": "The AVS session service is unreachable. Collaboration is paused; search and DRES submission are unaffected.",
        "properties": {
          "error": {
            "type": "string"
          },
          "collab": {
            "type": "string",
            "enum": [
              "offline"
            ]
          },
          "hint": {
            "type": "string",
            "description": "What still works, so the operator does not stop trusting the tool"
          },
          "detail": {
            "type": "string",
            "description": "Underlying transport error, when there is one"
          }
        }
      }
    }
  }
}
