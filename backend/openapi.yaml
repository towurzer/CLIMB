{
  "openapi": "3.0.3",
  "info": {
    "title": "Video Retrieval API",
    "description": "API specification for the CLIMB backend, a Video Browser allowing for searching, browsing, and DRES integration (known-item, VQA text answer, and collaborative Ad-hoc Video Search submissions).\n\nv2.0.0: results are scenes, not keyframes. `shot_id` is replaced by `scene_id` (the master shot) plus `keyframe_id` (the frame shown). Thumbnails are served from /thumbs and /kf, videos from /videos, all derived from (video_id, shot_index, kf_index). Find-similar moved to /climb/search/similar/{keyframe_id}.",
    "version": "2.0.0"
  },
  "servers": [
    {
      "url": "http://localhost:8000",
      "description": "Local development server"
    },
    {
      "url": "http://redacted",
      "description": "Online Server"
    }
  ],
  "paths": {
    "/climb/health": {
      "get": {
        "summary": "Liveness probe for the backend and the embedding service",
        "description": "Answers as long as the backend process is running. Reaching it requires no database or cache, so a response always means the API itself is up. It additionally probes the Python embedding worker at SEARCH_ENGINE_URL/api/health with a 2 second timeout and reports the outcome, but never fails because of it: the status code stays 200 whenever the backend lives, and callers read the body to tell a healthy system from a degraded one. The frontend polls this every 5 seconds to drive the coloured indicator in the header - green for status 'ok', orange for 'degraded', red when this endpoint cannot be reached at all.",
        "operationId": "healthCheck",
        "responses": {
          "200": {
            "description": "Backend is alive. 'status' is 'ok' only when the embedding service is ready too, otherwise 'degraded'.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "status": {
                      "type": "string",
                      "description": "'ok' when every component answered, 'degraded' when the backend is up but the embedding service is not usable",
                      "enum": [
                        "ok",
                        "degraded"
                      ]
                    },
                    "backend": {
                      "type": "string",
                      "description": "Always 'ok' - if the backend were not, this response would not exist",
                      "enum": [
                        "ok"
                      ]
                    },
                    "embedding_service": {
                      "type": "object",
                      "description": "Outcome of the probe against the Python embedding worker",
                      "properties": {
                        "reachable": {
                          "type": "boolean",
                          "description": "Whether the worker answered the probe at all"
                        },
                        "ready": {
                          "type": "boolean",
                          "description": "Whether the worker answered and has an initialized search engine. Text search only works when this is true."
                        },
                        "detail": {
                          "type": "string",
                          "description": "Human readable reason, surfaced as the tooltip of the header indicator"
                        }
                      }
                    },
                    "uptime_seconds": {
                      "type": "integer",
                      "description": "Whole seconds since the backend process started"
                    },
                    "time": {
                      "type": "string",
                      "format": "date-time",
                      "description": "Server clock at the time of the response, ISO 8601"
                    }
                  }
                },
                "examples": {
                  "healthy": {
                    "summary": "Backend and embedding service both up",
                    "value": {
                      "status": "ok",
                      "backend": "ok",
                      "embedding_service": {
                        "reachable": true,
                        "ready": true,
                        "detail": "Embedding service ready"
                      },
                      "uptime_seconds": 4213,
                      "time": "2026-07-26T12:34:56.789Z"
                    }
                  },
                  "degraded": {
                    "summary": "Backend up, embedding worker not running",
                    "value": {
                      "status": "degraded",
                      "backend": "ok",
                      "embedding_service": {
                        "reachable": false,
                        "ready": false,
                        "detail": "Embedding service unreachable: connect ECONNREFUSED 127.0.0.1:5000"
                      },
                      "uptime_seconds": 12,
                      "time": "2026-07-26T12:34:56.789Z"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/climb/search": {
      "get": {
        "summary": "Search for video segments matching the text query",
        "operationId": "searchVideos",
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "required": true,
            "description": "Text query for search. To exclude specific videos from results, append ' --exclude: videoId1, videoId2, ...' to the query. Example: 'person running --exclude: V3C1_001, V3C1_002'",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "page",
            "in": "query",
            "required": false,
            "description": "Page number for pagination (default: 1)",
            "schema": {
              "type": "integer",
              "default": 1,
              "minimum": 1
            }
          },
          {
            "name": "per_page",
            "in": "query",
            "required": false,
            "description": "Number of results per page (default: 24, max: 100)",
            "schema": {
              "type": "integer",
              "default": 24,
              "minimum": 1,
              "maximum": 100
            }
          },
          {
            "name": "avs_session",
            "in": "query",
            "required": false,
            "description": "Active AVS session code. When provided, scenes already submitted in that collaborative session are removed from the results, and the session's idle timer is refreshed.",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Search results",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SearchResponse"
                }
              }
            }
          }
        }
      }
    },
    "/climb/videos": {
      "get": {
        "summary": "List all videos in the dataset",
        "operationId": "listVideos",
        "responses": {
          "200": {
            "description": "List of videos",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "count": {
                      "type": "integer"
                    },
                    "videos": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/VideoSummary"
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/climb/videos/{video_id}": {
      "get": {
        "summary": "Get metadata for a specific video",
        "operationId": "getVideoInfo",
        "parameters": [
          {
            "name": "video_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Detailed video metadata",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/VideoDetails"
                }
              }
            }
          }
        }
      }
    },
    "/climb/dres/connect": {
      "post": {
        "summary": "Authenticate with DRES and fetch the active evaluation ID",
        "operationId": "connectDres",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DresLoginRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Connection successful",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "status": {
                      "type": "string"
                    },
                    "evaluation_id": {
                      "type": "string"
                    },
                    "selected_name": {
                      "type": "string",
                      "nullable": true
                    },
                    "defaulted": {
                      "type": "boolean"
                    },
                    "message": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/climb/dres/status": {
      "get": {
        "summary": "Check current DRES connection status and active task",
        "operationId": "dresStatus",
        "responses": {
          "200": {
            "description": "Status payload",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "connected": {
                      "type": "boolean"
                    },
                    "evaluation_id": {
                      "type": "string",
                      "nullable": true
                    },
                    "active_task": {
                      "type": "string",
                      "nullable": true
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/climb/dres/submit/kis": {
      "post": {
        "summary": "Submit a video segment to the DRES server (KiS)",
        "operationId": "submitToDres",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DresSubmission"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Submission result, including the verdict reported by DRES",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DresSubmissionResult"
                }
              }
            }
          },
          "400": {
            "description": "DRES rejected the submission",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DresSubmissionError"
                }
              }
            }
          },
          "401": {
            "description": "Not connected to DRES",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DresSubmissionError"
                }
              }
            }
          }
        }
      }
    },
    "/climb/dres/submit/vqa": {
      "post": {
        "summary": "Submit a VQA text answer together with the selected media segment to the DRES server",
        "operationId": "submitVqaToDres",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/VqaSubmission"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Submission result, including the verdict reported by DRES",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DresSubmissionResult"
                }
              }
            }
          },
          "400": {
            "description": "Missing answer text, or DRES rejected the submission",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DresSubmissionError"
                }
              }
            }
          },
          "401": {
            "description": "Not connected to DRES",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DresSubmissionError"
                }
              }
            }
          }
        }
      }
    },
    "/climb/dres/submit/vqa/text": {
      "post": {
        "summary": "Submit a VQA text answer to the DRES server without any media item",
        "operationId": "submitVqaTextOnlyToDres",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/VqaTextSubmission"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Submission result, including the verdict reported by DRES",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DresSubmissionResult"
                }
              }
            }
          },
          "400": {
            "description": "Missing answer text, or DRES rejected the submission",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DresSubmissionError"
                }
              }
            }
          },
          "401": {
            "description": "Not connected to DRES",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DresSubmissionError"
                }
              }
            }
          }
        }
      }
    },
    "/climb/avs/session": {
      "post": {
        "summary": "Create a new collaborative AVS session",
        "description": "Creates a fresh session with a random 4-letter (consonant-only) code and returns its snapshot. Sessions are shared by every client of this backend and are deleted after 5 minutes with no interaction (submit, in-session search, or GET poll).",
        "operationId": "createAvsSession",
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "name": {
                    "type": "string",
                    "nullable": true,
                    "description": "Optional human-readable label for the session"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Session created",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AvsSession"
                }
              }
            }
          }
        }
      }
    },
    "/climb/avs/sessions": {
      "get": {
        "summary": "List active AVS sessions",
        "description": "Lightweight listing for a 'join one of these' UI.",
        "operationId": "listAvsSessions",
        "responses": {
          "200": {
            "description": "Active sessions",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "sessions": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/AvsSessionSummary"
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/climb/avs/session/{code}/join": {
      "post": {
        "summary": "Join an existing AVS session by code",
        "description": "Returns the session snapshot (case-insensitive code) and refreshes its idle timer. 404 means the session does not exist or has expired.",
        "operationId": "joinAvsSession",
        "parameters": [
          {
            "name": "code",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Joined; session snapshot",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AvsSession"
                }
              }
            }
          },
          "404": {
            "description": "Session not found or expired",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AvsSessionError"
                }
              }
            }
          }
        }
      }
    },
    "/climb/avs/session/{code}": {
      "get": {
        "summary": "Fetch an AVS session snapshot (also the poll/heartbeat)",
        "description": "Returns the current scenes, covered videos, and counts for the session, and refreshes its idle timer. Clients poll this endpoint to stay in sync and to keep the session alive; a 404 tells a client its session has expired.",
        "operationId": "getAvsSession",
        "parameters": [
          {
            "name": "code",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Session snapshot",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AvsSession"
                }
              }
            }
          },
          "404": {
            "description": "Session not found or expired",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AvsSessionError"
                }
              }
            }
          }
        }
      }
    },
    "/climb/videos/{video_id}/scenes": {
      "get": {
        "summary": "Get scenes (master shots) for a specific video",
        "description": "Returns scenes in shot order, each with its keyframes. Omit both `page` and `per_page` for every scene in one response.",
        "operationId": "getVideoScenes",
        "parameters": [
          {
            "name": "video_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "page",
            "in": "query",
            "required": false,
            "description": "Page number (1-indexed). Enables pagination.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "default": 1
            }
          },
          {
            "name": "per_page",
            "in": "query",
            "required": false,
            "description": "Number of shots per page (capped at 200). Enables pagination.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 200,
              "default": 60
            }
          }
        ],
        "responses": {
          "200": {
            "description": "List of shots",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "video_id": {
                      "type": "string"
                    },
                    "total": {
                      "type": "integer",
                      "description": "Total number of shots for this video, regardless of pagination."
                    },
                    "scenes": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/SceneInfo"
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/climb/search/similar/{keyframe_id}": {
      "get": {
        "summary": "Find scenes visually similar to a keyframe",
        "operationId": "findSimilar",
        "parameters": [
          {
            "name": "keyframe_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "integer"
            },
            "description": "Keyframe to find neighbours of"
          },
          {
            "name": "exclude",
            "in": "query",
            "required": false,
            "description": "Comma-separated video ids to leave out of the results. Filtering happens inside the query, so the result limit is backfilled with the next best matches.",
            "schema": {
              "type": "string"
            },
            "example": "00113,00184"
          },
          {
            "name": "page",
            "in": "query",
            "required": false,
            "description": "1-based page number. Results are not capped - paging continues until the shots table is exhausted.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "default": 1
            }
          },
          {
            "name": "per_page",
            "in": "query",
            "required": false,
            "description": "Results per page, clamped to 1-100.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 24
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Similar search results",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "excluded": {
                      "type": "array",
                      "description": "The video ids that were excluded from this result set",
                      "items": {
                        "type": "string"
                      }
                    },
                    "page": {
                      "type": "integer"
                    },
                    "per_page": {
                      "type": "integer"
                    },
                    "count": {
                      "type": "integer",
                      "description": "Number of results on this page"
                    },
                    "has_more": {
                      "type": "boolean",
                      "description": "Whether a further page of similar shots exists"
                    },
                    "results": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/SearchResult"
                      }
                    },
                    "source_keyframe": {
                      "type": "integer"
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "SearchResult": {
        "type": "object",
        "properties": {
          "video_id": {
            "type": "string"
          },
          "score": {
            "type": "number",
            "format": "float"
          },
          "start_frame": {
            "type": "integer"
          },
          "end_frame": {
            "type": "integer"
          },
          "fps": {
            "type": "number",
            "format": "float"
          },
          "start_time_ms": {
            "type": "integer"
          },
          "end_time_ms": {
            "type": "integer"
          },
          "thumbnail_url": {
            "type": "string"
          },
          "scene_id": {
            "type": "integer",
            "description": "Master shot this result belongs to"
          },
          "keyframe_id": {
            "type": "integer",
            "description": "Keyframe shown for the scene"
          }
        },
        "required": [
          "video_id",
          "score",
          "start_frame",
          "end_frame",
          "fps",
          "start_time_ms",
          "end_time_ms",
          "thumbnail_url",
          "scene_id"
        ]
      },
      "SearchResponse": {
        "type": "object",
        "properties": {
          "query": {
            "type": "string"
          },
          "page": {
            "type": "integer",
            "description": "Current page number"
          },
          "per_page": {
            "type": "integer",
            "description": "Number of results per page"
          },
          "count": {
            "type": "integer",
            "description": "Number of results in current page"
          },
          "has_more": {
            "type": "boolean",
            "description": "Whether more results are available beyond the current page"
          },
          "results": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/SearchResult"
            }
          }
        },
        "required": [
          "query",
          "page",
          "per_page",
          "count",
          "has_more",
          "results"
        ]
      },
      "VideoSummary": {
        "type": "object",
        "properties": {
          "video_id": {
            "type": "string"
          },
          "fps": {
            "type": "number",
            "format": "float"
          },
          "duration_sec": {
            "type": "number",
            "format": "float"
          },
          "thumbnail_url": {
            "type": "string"
          },
          "num_scenes": {
            "type": "integer"
          }
        },
        "required": [
          "video_id",
          "fps",
          "duration_sec",
          "num_shots",
          "thumbnail_url"
        ]
      },
      "VideoDetails": {
        "type": "object",
        "properties": {
          "video_id": {
            "type": "string"
          },
          "fps": {
            "type": "number",
            "format": "float"
          },
          "duration_sec": {
            "type": "number",
            "format": "float"
          },
          "width": {
            "type": "integer"
          },
          "height": {
            "type": "integer"
          },
          "video_url": {
            "type": "string"
          }
        },
        "required": [
          "video_id",
          "fps",
          "duration_sec",
          "width",
          "height",
          "video_url"
        ]
      },
      "DresSubmission": {
        "type": "object",
        "description": "Shared by KIS and AVS. The video_id + time range are what DRES scores. For AVS, additionally pass avs_session plus the scene's start_frame/end_frame so the delivered scene is recorded into the shared session and hidden from teammates.",
        "properties": {
          "video_id": {
            "type": "string"
          },
          "start_time_ms": {
            "type": "integer"
          },
          "end_time_ms": {
            "type": "integer"
          },
          "avs_session": {
            "type": "string",
            "nullable": true,
            "description": "AVS session code to record this scene into. Omit for KIS submissions."
          },
          "start_frame": {
            "type": "integer",
            "nullable": true,
            "description": "Scene start frame; identifies the scene (with end_frame) for AVS session recording. A scene spans many keyframes, so recording by frame range hides the whole scene, not just the submitted keyframe."
          },
          "end_frame": {
            "type": "integer",
            "nullable": true,
            "description": "Scene end frame; see start_frame."
          }
        },
        "required": [
          "video_id",
          "start_time_ms",
          "end_time_ms"
        ]
      },
      "VqaSubmission": {
        "type": "object",
        "properties": {
          "text_answer": {
            "type": "string"
          },
          "video_id": {
            "type": "string",
            "nullable": true
          },
          "start_time_ms": {
            "type": "integer",
            "nullable": true
          },
          "end_time_ms": {
            "type": "integer",
            "nullable": true
          }
        },
        "required": [
          "text_answer"
        ]
      },
      "VqaTextSubmission": {
        "type": "object",
        "properties": {
          "text_answer": {
            "type": "string"
          }
        },
        "required": [
          "text_answer"
        ]
      },
      "DresSubmissionResult": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "success",
              "pending"
            ],
            "description": "'pending' when DRES accepted the submission but has not graded it yet (HTTP 202)"
          },
          "dres_status": {
            "type": "integer",
            "description": "HTTP status code returned by the DRES submission endpoint"
          },
          "status_summary": {
            "type": "string",
            "description": "Human readable summary of dres_status, e.g. 'Accepted & graded'"
          },
          "verdict": {
            "type": "string",
            "nullable": true,
            "enum": [
              "CORRECT",
              "WRONG",
              "INDETERMINATE",
              "UNDECIDABLE",
              null
            ],
            "description": "The verdict reported by DRES, null while no verdict is available"
          },
          "message": {
            "type": "string"
          },
          "dres_response": {
            "type": "object",
            "description": "The raw SuccessfulSubmissionsStatus payload returned by DRES"
          }
        },
        "required": [
          "status",
          "dres_status",
          "status_summary",
          "message"
        ]
      },
      "DresSubmissionError": {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          },
          "dres_status": {
            "type": "integer",
            "nullable": true,
            "description": "HTTP status code returned by DRES, null when DRES could not be reached"
          },
          "status_summary": {
            "type": "string"
          },
          "details": {
            "type": "string"
          }
        },
        "required": [
          "error"
        ]
      },
      "DresLoginRequest": {
        "type": "object",
        "properties": {
          "username": {
            "type": "string"
          },
          "password": {
            "type": "string"
          },
          "dres_url": {
            "type": "string",
            "default": "https://vbs.videobrowsing.org"
          },
          "dres_name": {
            "type": "string",
            "description": "Requested evaluation name (e.g. IVADL26)",
            "default": "IVADL26"
          }
        },
        "required": [
          "username",
          "password",
          "dres_url"
        ]
      },
      "AvsScene": {
        "type": "object",
        "description": "A scene submitted within an AVS session, keyed by its frame range.",
        "properties": {
          "video_id": {
            "type": "string"
          },
          "start_frame": {
            "type": "integer"
          },
          "end_frame": {
            "type": "integer"
          },
          "status": {
            "type": "string",
            "enum": [
              "CORRECT",
              "WRONG",
              "INDETERMINATE",
              "UNDECIDABLE"
            ],
            "description": "DRES verdict at the time the scene was submitted (INDETERMINATE while a live judgement is pending). A CORRECT scene's video is reported in coveredVideos."
          }
        },
        "required": [
          "video_id",
          "start_frame",
          "end_frame",
          "status"
        ]
      },
      "AvsSession": {
        "type": "object",
        "description": "Snapshot of a collaborative AVS session.",
        "properties": {
          "code": {
            "type": "string",
            "description": "4-letter session code"
          },
          "name": {
            "type": "string",
            "nullable": true
          },
          "scenes": {
            "type": "array",
            "description": "Scenes already submitted in this session (hide these from search / mark them in browse).",
            "items": {
              "$ref": "#/components/schemas/AvsScene"
            }
          },
          "coveredVideos": {
            "type": "array",
            "description": "Video ids with at least one CORRECT hit; dim their remaining shots.",
            "items": {
              "type": "string"
            }
          },
          "counts": {
            "type": "object",
            "properties": {
              "instances": {
                "type": "integer",
                "description": "Number of distinct scenes submitted"
              },
              "distinctVideos": {
                "type": "integer",
                "description": "Number of distinct videos those scenes span"
              }
            }
          },
          "expiresInMs": {
            "type": "integer",
            "description": "Milliseconds until this session idles out, unless an interaction refreshes it"
          }
        },
        "required": [
          "code",
          "scenes",
          "coveredVideos",
          "counts",
          "expiresInMs"
        ]
      },
      "AvsSessionSummary": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string"
          },
          "name": {
            "type": "string",
            "nullable": true
          },
          "instances": {
            "type": "integer"
          },
          "expiresInMs": {
            "type": "integer"
          }
        },
        "required": [
          "code",
          "instances",
          "expiresInMs"
        ]
      },
      "AvsSessionError": {
        "type": "object",
        "properties": {
          "error": {
            "type": "string"
          }
        },
        "required": [
          "error"
        ]
      },
      "SceneInfo": {
        "type": "object",
        "properties": {
          "start_frame": {
            "type": "integer"
          },
          "end_frame": {
            "type": "integer"
          },
          "fps": {
            "type": "number",
            "format": "float"
          },
          "thumbnail_url": {
            "type": "string"
          },
          "scene_id": {
            "type": "integer",
            "description": "Master shot this result belongs to"
          },
          "keyframe_id": {
            "type": "integer",
            "description": "Keyframe shown for the scene"
          }
        },
        "required": [
          "start_frame",
          "end_frame",
          "fps",
          "thumbnail_url",
          "scene_id"
        ]
      }
    }
  }
}
